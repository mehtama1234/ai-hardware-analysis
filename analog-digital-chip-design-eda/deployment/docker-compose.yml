services:
  verification-pilot:
    restart: unless-stopped
    init: true
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8080:8080"
    cpus: "${VERIFICATION_API_CPUS:-1.0}"
    mem_limit: ${VERIFICATION_API_MEMORY:-512m}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      VERIFICATION_SERVICE_API_KEY: ${VERIFICATION_SERVICE_API_KEY:?set an API key}
      VERIFICATION_DEPLOYMENT_TIER: ${VERIFICATION_DEPLOYMENT_TIER:-pilot}
      VERIFICATION_DATABASE_URL: ${VERIFICATION_DATABASE_URL:-}
      VERIFICATION_EVIDENCE_STORE_PROVIDER: ${VERIFICATION_EVIDENCE_STORE_PROVIDER:-filesystem-pilot}
      VERIFICATION_EVIDENCE_STORE_BUCKET: ${VERIFICATION_EVIDENCE_STORE_BUCKET:-}
      VERIFICATION_REQUIRE_IDENTITY_SUBJECT: ${VERIFICATION_REQUIRE_IDENTITY_SUBJECT:-false}
      VERIFICATION_REVIEWER_ROLE: ${VERIFICATION_REVIEWER_ROLE:-}
      VERIFICATION_IDENTITY_ISSUER: ${VERIFICATION_IDENTITY_ISSUER:-}
      VERIFICATION_IDENTITY_AUDIENCE: ${VERIFICATION_IDENTITY_AUDIENCE:-}
      VERIFICATION_IDENTITY_JWKS_URL: ${VERIFICATION_IDENTITY_JWKS_URL:-}
      VERIFICATION_EXECUTION_SANDBOX: ${VERIFICATION_EXECUTION_SANDBOX:-}
      VERIFICATION_EXECUTION_WORKSPACE: ${VERIFICATION_EXECUTION_WORKSPACE:-}
      VERIFICATION_EXECUTION_NETWORK_POLICY: ${VERIFICATION_EXECUTION_NETWORK_POLICY:-}
      VERIFICATION_JOB_MAX_WORKSPACE_BYTES: ${VERIFICATION_JOB_MAX_WORKSPACE_BYTES:-}
      VERIFICATION_JOB_MAX_FILE_BYTES: ${VERIFICATION_JOB_MAX_FILE_BYTES:-}
      VERIFICATION_OBSERVABILITY_ENDPOINT: ${VERIFICATION_OBSERVABILITY_ENDPOINT:-}
      VERIFICATION_BACKUP_POLICY: ${VERIFICATION_BACKUP_POLICY:-}
      VERIFICATION_PROJECT_KEYS: ${VERIFICATION_PROJECT_KEYS:-}
      VERIFICATION_PROJECT_SUBJECTS: ${VERIFICATION_PROJECT_SUBJECTS:-}
      VERIFICATION_JOB_TIMEOUT_SECONDS: ${VERIFICATION_JOB_TIMEOUT_SECONDS:-1800}
      VERIFICATION_MAX_QUEUED_JOBS: ${VERIFICATION_MAX_QUEUED_JOBS:-32}
      VERIFICATION_WORKER_TIMEOUT_SECONDS: ${VERIFICATION_WORKER_TIMEOUT_SECONDS:-1800}
    volumes:
      - verification-pilot-artifacts:/app/.artifacts
    read_only: true
    tmpfs:
      - /tmp
  verification-pilot-worker:
    restart: unless-stopped
    init: true
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["python3", "-m", "deployment.worker"]
    cpus: "${VERIFICATION_WORKER_CPUS:-2.0}"
    mem_limit: ${VERIFICATION_WORKER_MEMORY:-2g}
    environment:
      VERIFICATION_SERVICE_API_KEY: ${VERIFICATION_SERVICE_API_KEY:?set an API key}
      VERIFICATION_DEPLOYMENT_TIER: ${VERIFICATION_DEPLOYMENT_TIER:-pilot}
      VERIFICATION_EXECUTION_SANDBOX: ${VERIFICATION_EXECUTION_SANDBOX:-}
      VERIFICATION_EXECUTION_WORKSPACE: ${VERIFICATION_EXECUTION_WORKSPACE:-}
      VERIFICATION_EXECUTION_NETWORK_POLICY: ${VERIFICATION_EXECUTION_NETWORK_POLICY:-}
      VERIFICATION_JOB_MAX_WORKSPACE_BYTES: ${VERIFICATION_JOB_MAX_WORKSPACE_BYTES:-}
      VERIFICATION_JOB_MAX_FILE_BYTES: ${VERIFICATION_JOB_MAX_FILE_BYTES:-}
      VERIFICATION_REVIEWER_ROLE: ${VERIFICATION_REVIEWER_ROLE:-}
      VERIFICATION_IDENTITY_ISSUER: ${VERIFICATION_IDENTITY_ISSUER:-}
      VERIFICATION_IDENTITY_AUDIENCE: ${VERIFICATION_IDENTITY_AUDIENCE:-}
      VERIFICATION_IDENTITY_JWKS_URL: ${VERIFICATION_IDENTITY_JWKS_URL:-}
      VERIFICATION_PROJECT_SUBJECTS: ${VERIFICATION_PROJECT_SUBJECTS:-}
    volumes:
      - verification-pilot-artifacts:/app/.artifacts
    read_only: true
    tmpfs:
      - /tmp

volumes:
  verification-pilot-artifacts:
