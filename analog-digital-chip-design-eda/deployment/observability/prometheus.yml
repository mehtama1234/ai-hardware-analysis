global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/verification-pilot-alert-rules.yaml

scrape_configs:
  - job_name: verification-pilot
    metrics_path: /metrics/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["verification-pilot:8080"]
