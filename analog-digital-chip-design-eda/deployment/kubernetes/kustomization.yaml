apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - verification-pilot.yaml

# Pin a release in deployment automation with:
#   kustomize edit set image verification-pilot=registry.example/verification-pilot:2026.09.10
images:
  - name: verification-pilot
    newName: verification-pilot
    newTag: 0.1.0
