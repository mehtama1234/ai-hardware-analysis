apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../backup

# The ConfigMap and Secrets are created out-of-band from
# verification-production-config.example.yaml and the customer's secret
# manager. They are referenced here but never generated with credentials.
patches:
  - path: deployment-production-patch.yaml
