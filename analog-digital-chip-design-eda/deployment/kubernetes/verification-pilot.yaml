apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verification-pilot-artifacts
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verification-pilot
  template:
    metadata:
      labels:
        app: verification-pilot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: verification-pilot:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VERIFICATION_SERVICE_API_KEY_FILE
              value: /run/secrets/api-key
            - name: VERIFICATION_JOB_TIMEOUT_SECONDS
              value: "1800"
            - name: VERIFICATION_MAX_QUEUED_JOBS
              value: "32"
            - name: VERIFICATION_EXECUTION_WORKSPACE
              value: disposable
            - name: VERIFICATION_EXECUTION_NETWORK_POLICY
              value: deny-by-default
          volumeMounts:
            - name: artifacts
              mountPath: /app/.artifacts
            - name: tmp
              mountPath: /tmp
            - name: api-key
              mountPath: /run/secrets
              readOnly: true
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 128Mi}
            limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 1Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
        - name: worker
          image: verification-pilot:0.1.0
          imagePullPolicy: IfNotPresent
          command: [python3, -m, deployment.worker]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: VERIFICATION_WORKER_TIMEOUT_SECONDS
              value: "1800"
            - name: VERIFICATION_EXECUTION_WORKSPACE
              value: disposable
            - name: VERIFICATION_EXECUTION_NETWORK_POLICY
              value: deny-by-default
          volumeMounts:
            - name: artifacts
              mountPath: /app/.artifacts
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 256Mi}
            limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: verification-pilot-artifacts
        - name: tmp
          emptyDir: {}
        - name: api-key
          secret:
            secretName: verification-pilot-api
---
apiVersion: v1
kind: Service
metadata:
  name: verification-pilot
spec:
  selector:
    app: verification-pilot
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verification-pilot-default-egress-deny
spec:
  podSelector:
    matchLabels:
      app: verification-pilot
  policyTypes:
    - Egress
  egress:
    # DNS is required for normal cluster service discovery. Customer adapter
    # endpoints must be added as an explicit namespace/IP rule per deployment.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
