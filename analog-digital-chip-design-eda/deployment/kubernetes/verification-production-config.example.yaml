# Example only. Apply values through the customer's secret/configuration
# management system; this file intentionally contains no credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: verification-production-config
data:
  evidence-store-bucket: customer-verification-evidence
  backup-policy: daily-35d
  dr-rpo-minutes: "15"
  dr-rto-minutes: "60"
  identity-issuer: https://issuer.example.com/
  identity-audience: verification-platform
  identity-jwks-url: https://issuer.example.com/.well-known/jwks.json
  reviewer-role: verification-reviewer
  operator-role: verification-operator
  project-subjects: '{"customer-project":["subject-from-enterprise-idp"]}'
  observability-endpoint: https://otel.example.com/
  logs-endpoint: https://logs.example.com/
  alertmanager-endpoint: https://alerts.example.com/
  slo-owner: verification-platform-oncall@example.com
  eda-adapters: '[{"name":"customer-sim","kind":"simulation","executable":"customer-sim","version":"2026.1"}]'
  execution-workspace: disposable
  execution-network-policy: deny-by-default
  max-workspace-bytes: "2147483648"
  max-file-bytes: "536870912"
---
apiVersion: v1
kind: Secret
metadata:
  name: verification-production-database
type: Opaque
stringData:
  database-url: replace-out-of-band
